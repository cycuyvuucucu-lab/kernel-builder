name: Build Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libncurses5-dev libsqlite3-dev libgmp-dev libmpfr-dev libmpc-dev repo git curl wget zip unzip python3

      - name: Setup Workspace and Toolchain
        run: |
          mkdir -p workspace
          cd workspace
          
          # Clone Kernel Source using reliable mirror
          git clone --depth=1 https://github.com/LineageOS/android_kernel_oneplus_sm6375 -b lineage-21.0 kernel_source
          
          # Download AOSP Clang Toolchain
          mkdir -p clang
          cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          tar -xf clang-r450784d.tar.gz
          cd ..

      - name: Build Kernel
        run: |
          cd workspace/kernel_source
          
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-

          # Defconfig for Nord CE 3 Lite (SM6375)
          make O=out vendor/sm6375-perf_defconfig
          
          # Build Process
          make -j$(nproc --all) O=out

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Nord-CE3-Lite-Kernel
          path: workspace/kernel_source/out/arch/arm64/boot/Image*
