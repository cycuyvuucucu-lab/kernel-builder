name: Build Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kernel Workspace
        run: |
          mkdir -p workspace
          cd workspace
          
          # Download Android GKI Kernel Source (Kernel 5.4 - Android 12/13/14/15)
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android12-5.4 kernel_source
          
          # Toolchain Setup
          mkdir -p clang
          cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          tar -xf clang-r450784d.tar.gz
          cd ..

      - name: Build GKI Kernel
        run: |
          cd workspace/kernel_source
          
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-

          make O=out gki_defconfig
          make -j$(nproc --all) O=out

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Nord-CE3-Lite-GKI-Kernel
          path: workspace/kernel_source/out/arch/arm64/boot/Image*
